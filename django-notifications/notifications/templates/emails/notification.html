<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>{{ title }}</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f4f4;font-family:Arial, sans-serif;">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
      <tr>
        <td align="center" style="padding:20px 0;">
          <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600" style="background:#ffffff;border-radius:8px;overflow:hidden;">
            <!-- Header -->
            <tr>
              <td align="center" bgcolor="#007bff" style="padding:20px;">
                <h1 style="margin:0;color:#ffffff;font-size:24px;">New Notification</h1>
              </td>
            </tr>
            <!-- Content -->
            <tr>
              <td style="padding:20px;text-align:left;color:#333333;font-size:16px;line-height:1.5;">
                <p>Hello {{ first_name }},</p>
                <p>You have a new notification:</p>
                <h3 style="margin:10px 0;">Title: {{ title }}</h3>
                <p style="margin:10px 0;">Message: {{ message }}</p>
                <p>If you did not expect this, please contact our support team.</p>
              </td>
            </tr>
            <!-- Footer -->
            <tr>
              <td align="center" style="padding:20px;background:#f4f4f4;color:#777777;font-size:12px;">
                <p style="margin:0;">&copy; 2025 TLS Inc. All rights reserved.</p>
                <p style="margin:0;">You are receiving this email because you have an account with us.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
